<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Information</title>
    <link rel="stylesheet" href="medicalCondition.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-box">
            <img src="image/utemLogoo.png" alt="UTeM Logo">
        </div>

        <div class="title">
            DIGITAL CLINIC QUEUE MANAGEMENT SYSTEM <br>
            FOR PKU UTeM
        </div>

        <div class="icons">
            <img src="image/instagramIcon.png" alt="Instagram">
            <img src="image/facebookIcon.png" alt="Facebook">
            <img src="image/tiktokIcon.png" alt="Tiktok">
        </div>
    </div>

    <div class="main">

        <div class="left-sec">
            <a href="register.html" class="back">
                <img src="image/backIconDark.png" alt="Back">
            </a>

            <h2>
                Welcome To <br>
                UTeM's PKU <br>
                Digital Clinic <br>
                Queue
            </h2>
        </div>

        <div class="right-sec">

            <h1>REGISTER</h1>

            <p class="description">
                Do you have any allergies or existing medical conditions?
                If yes, please specify. You can edit or change this later
                in your profile.
            </p>

            <form>

                <label>Allergy</label>
                <textarea rows="4"></textarea>

                <label>Chronic Disease</label>
                <textarea rows="4"></textarea>

                <label>Current Medication</label>
                <textarea rows="4"></textarea>

                <div class="button-group">
                    <a href="register.html" class="back-button">BACK</a>
                    <a href="login.html" class="register-button">REGISTER</a>
                </div>

                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Log In</a>
                </p>

            </form>

        </div>

    </div>

</div>
    
</body>
</html>
