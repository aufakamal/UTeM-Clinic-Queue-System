<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password Success</title>
    <link rel="stylesheet" href="resetSuccess.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-box">
            <img src="image/utemLogo.png" alt="UTeM Logo">
        </div>

        <div class="title">
            DIGITAL CLINIC QUEUE MANAGEMENT SYSTEM <br>
            FOR PKU UTeM
        </div>

        <div class="icons">
            <img src="image/instagramIcon.png" alt="Instagram">
            <img src="image/facebookIcon.png" alt="Facebook">
            <img src="image/tiktokIcon.png" alt="TikTok">
        </div>
    </div>

    <div class="main">

        <a href="resetPassword.html" class="back">
            <img src="image/backIconDark.png" alt="Back">
        </a>

        <div class="successCard">

            <img src="image/resetPasswordIcon.png" alt="Reset Password" class="successIcon">

            <h1>RESET PASSWORD</h1>

            <p class="smallText">
                Your password has been successfully reset.
            </p>

            <p class="successMessage">
                Please <a href="login.html">log in</a> again using your new password.
            </p>

        </div>

    </div>

</div>

<script src="loginRegister.js"></script>
</body>
</html>
