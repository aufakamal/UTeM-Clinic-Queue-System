<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile Page</title>
    <link rel="stylesheet" href="../shared/profile.css">

</head>
<body>

<div class="profilePage">

    <div class="profileTitle">
        <a href="profileDoctor.html">
            <img src="../images/backIconDark.png" class="backIcon" alt="Back">
        </a>

        <h1>EDIT PROFILE</h1>
    </div>

    <div class="profileCard">

        <div class="editHeader">
            <img src="../images/profileIconDark.png" class="editProfileImage" alt="Profile Icon">
        </div>

        <form class="editForm">

            <div class="nameRow">
                <div>
                    <label>First Name</label>
                    <input type="text" value="Alisa">
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" value="Sarah">
                </div>
            </div>

            <label>Email</label>
            <input type="email" value="lisarah@gmail.com">

            <label>ID</label>
            <input type="text" value="D002134">

            <label>Phone Number</label>
            <input type="text" value="01345668547">

            <label>Password</label>
            <input type="password" value="123456789">

            
            <a href="changePasswordDoc.html" class="changePasswordLink">Change password</a>

            <h3>Services Provided</h3>

            <label><input type="checkbox" checked>General Consultation</label>
            <label><input type="checkbox" checked>Medical Checkup</label>
            <label><input type="checkbox" checked>Follow-up Visit</label>

            <label>Max Patients/Day</label>
            <input type="test" value="30">
            
            <a href="updateProfileSuccessDoc.html" class="saveBtn">SAVE</a>

        </form>

    </div>

</div>
</body>
</html>
