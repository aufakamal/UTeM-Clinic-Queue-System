<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link rel="stylesheet" href="admin-profile.css">
</head>

<body>

<div id="header">
    <div id="leftSection">
        <button class="iconBtn" onclick="window.location.href='profileAdmin.html'">
            ←
        </button>

        <h1>UTeM Clinic Queue System</h1>
    </div>

    <div id="rightSection">
        <h1>Admin Profile</h1>

        <div class="profileContainer">
            <button class="iconBtn" onclick="toggleMenu()">
                👤
            </button>

            <div id="profileDropdown">
                <a href="admin-profile.html">View Profile</a>
                <a href="../login_register/mainPage.php">Log Out</a>
            </div>
        </div>
    </div>
</div>

<div class="profilePage">
    <section class="profileCard">
        <div class="profileHeader">
            <div class="profileImage">👤</div>

            <div class="userInfo">
                <h2 id="profileName">Loading...</h2>
<p id="profileEmail">Loading...</p>
            </div>

            <div class="profileActions">
                <span class="roleName" id="profileRole">Loading...</span>

                <a href="admin-edit-profile.html" class="editBtn">
                    Change Profile Information
                </a>
            </div>
        </div>

        <div class="profileContent">
            <div class="leftInfo">
                <label>Staff ID</label>
                <input id="profileUserID" type="text" readonly>

                <label>Phone Number</label>
                <input id="profilePhone" type="text" readonly>

                <label>Password</label>
                <input id="profilePassword" type="password" readonly>
            </div>

            <div class="rightInfo">
                <h3>Staff Information</h3>

                <label>Department</label>
                <input type="text" value="PKU UTeM" readonly>

                <label>Role</label>
                <input id="profileRoleInput" type="text" readonly>

                <label>Status</label>
                <input type="text" value="Active" readonly>
            </div>
        </div>
    </section>
</div>

<script src="admin.js"></script>

</body>
</html>
