<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation History</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="header">

    <div id="leftSection">
        <button class="iconBtn" onclick="history.back()">
            <img class="icon" src="admin_images/backIconDark.png" alt="Back">
        </button>

        <h1>UTeM Clinic Queue System</h1>
    </div>

    <nav>
        <ul>
            <li><a href="profileAdmin.html">Dashboard</a></li>
            <li><a href="admin-appointments.html">Appointments</a></li>
            <li><a href="admin-queue.html">Queue</a></li>
            <li class="active"><a href="admin-history.html">History</a></li>
            <li><a href="admin-slots.html">Slots</a></li>
            <li><a href="admin-staff.html">Users</a></li>
        </ul>
    </nav>

    <div id="rightSection">
        <h1>Welcome, Admin!</h1>

        <div class="profileContainer">
            <button class="iconBtn" onclick="toggleMenu()">
                <img class="icon" src="admin_images/profileIconDark.png">
            </button>

            <div id="profileDropdown">
                <a href="admin-profile.html">View Profile</a>
                <a href="#" onclick="logout()">Log Out</a>
            </div>
        </div>
    </div>

</div>

<section class="admin-section">

<h2>Consultation History</h2>

<p>
View completed consultations and previous clinic visits.
</p>

<div class="filter-bar single-filter">
    <input type="text" id="historySearch" placeholder="Search consultation ID, queue no, patient, or doctor..." onkeyup="filterHistory()">
</div>

<div class="table-card">

<table class="admin-table">

<thead>

<tr>
    <th>Consultation ID</th>
    <th>Queue No</th>
    <th>Patient</th>
    <th>Doctor</th>
    <th>Start Time</th>
    <th>End Time</th>
    <th>Status</th>
</tr>

</thead>

<tbody id="historyTableBody"></tbody>

</table>

</div>

</section>

<script src="admin.js"></script>

</body>
</html>
