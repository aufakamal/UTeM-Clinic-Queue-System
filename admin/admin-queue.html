<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTeM PKU Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="header">
    <div id="leftSection">
        <button class="iconBtn" onclick="history.back()">
            <img class="icon" src="../images/backIconDark.png" alt="Back">
        </button>
        <h1>UTeM Clinic Queue System</h1>
    </div>

    <nav>
        <ul>
            <li><a href="profileAdmin.html">Dashboard</a></li>
            <li><a href="admin-appointments.html">Appointments</a></li>
            <li class="active"><a href="admin-queue.html">Queue</a></li>
            <li><a href="admin-history.html">History</a></li>
            <li><a href="admin-slots.html">Slots</a></li>
            <li><a href="admin-staff.html">Users</a></li>
        </ul>
    </nav>

    <div id="rightSection">
        <h1>Welcome, Admin!</h1>

        <div class="profileContainer">
            <button class="iconBtn" type="button" onclick="toggleMenu()">
                <img class="icon" src="../images/profileIconDark.png" alt="Profile">
            </button>

            <div id="profileDropdown">
                <a href="admin-profile.html">View Profile</a>
                <a href="#" onclick="logout()">Log Out</a>
            </div>
        </div>
    </div>
</div>

<section id="queue" class="page active">
    <h2>Queue Management</h2>
    <p>View today’s queue list and filter patients by room or status.</p>

    <div class="filter-bar">
        <input type="text" id="queueSearch" placeholder="Search patient name, queue number, or ID..." onkeyup="filterQueue()">

        <select id="queueStatusFilter" onchange="filterQueue()">
            <option value="All">All Status</option>
            <option value="Waiting">Waiting</option>
            <option value="In Consultation">In Consultation</option>
            <option value="At Pharmacy">At Pharmacy</option>
            <option value="Completed">Completed</option>
        </select>

        <select id="queueRoomFilter" onchange="filterQueue()">
            <option value="All">All Rooms</option>
            <option value="Room 1">Room 1</option>
            <option value="Room 2">Room 2</option>
            <option value="Pharmacy">Pharmacy</option>
        </select>
    </div>

    <div class="table-card">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Queue No.</th>
                    <th>Patient</th>
                    <th>User ID</th>
                    <th>Appointment Type</th>
                    <th>Room</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="queueTableBody"></tbody>
        </table>
    </div>
</section>

<div id="confirmBox" class="modal hidden">
    <div class="modal-card">
        <b id="confirmText">Are you sure?</b>
        <button class="green" onclick="confirmYes()">Confirm</button>
        <button class="red" onclick="closeConfirm()">Cancel</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
