<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTeM PKU Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="header">
    <div id="leftSection">
        <button class="iconBtn" onclick="history.back()">
            <img class="icon" src="../images/backIconDark.png" alt="Back Button">
        </button>

        <h1>UTeM Clinic Queue System</h1>
    </div>

    <nav>
        <ul>
            <li><a href="profileAdmin.html">Dashboard</a></li>
            <li class="active"><a href="admin-appointments.html">Appointments</a></li>
            <li><a href="admin-queue.html">Queue</a></li>
            <li><a href="admin-slots.html">Slots</a></li>
            <li><a href="admin-staff.html">Staff</a></li>
        </ul>
    </nav>

    <div id="rightSection">
        <h1>Welcome, Admin!</h1>

        <div class="profileContainer">
            <button class="iconBtn" type="button" onclick="toggleMenu()">
                <img class="icon" src="../images/profileIconDark.png" alt="Profile Icon">
            </button>

            <div id="profileDropdown">
                <a href="admin-profile.html">View Profile</a>
                <a href="#" onclick="logout()">Log Out</a>
            </div>
        </div>
    </div>
</div>

<section id="appointments" class="page active">
    <h2>Appointment Management</h2>
    <p>View appointments by date and manage late arrivals.</p>

    <div class="sub-menu">
        <button class="sub active" onclick="showAppointmentDates()">Dates</button>
        <button class="sub" onclick="showLateArrival()">Late Arrival</button>
    </div>

    <div id="appointmentContent"></div>
</section>

<div id="confirmBox" class="modal hidden">
    <div class="modal-card">
        <b id="confirmText">Are you sure?</b>
        <button class="green" onclick="confirmYes()">Confirm</button>
        <button class="red" onclick="closeConfirm()">Cancel</button>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
