<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTeM PKU Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
    <h1>UTeM PKU</h1>

    <div class="user-menu">
        <span class="welcome">Welcome, Admin!</span>

        <div class="profile-container">
            <div class="profile" onclick="toggleMenu()">
                👤
            </div>

           <div id="dropdownMenu" class="dropdown-menu hidden">
    <a href="admin-profile.html">View Profile</a>
    <a href="#" onclick="logout()">Log Out</a>
</div>
        </div>
    </div>
</header>

    <main>
        <nav>
    <a class="tab" href="admin-dashboard.html">Dashboard</a>
    <a class="tab" href="admin-appointments.html">Appointments</a>
    <a class="tab" href="admin-queue.html">Queue Management</a>
    <a class="tab active" href="admin-slots.html">Slots</a>
    <a class="tab" href="admin-staff.html">Staff</a>
</nav>

        
        <section id="slots" class="page active">
            <div class="actions">
                <button id="createSlotBtn" onclick="showSlotForm()">Create new slots +</button>
                <button id="deleteSlotBtn" onclick="toggleDeleteSlot()">Delete slots</button>
            </div>

            <div id="slotForm" class="form-card hidden">
                <label>Date: <input id="slotDate" placeholder="14/3/2026"></label>
                <label>Time: <input id="slotTime" placeholder="8:00 am"></label>
                <label>Doctor: <input id="slotDoctor" placeholder="A"></label>
                <label>Capacity: <input id="slotCapacity" placeholder="10"></label>
                <button class="green" onclick="createSlot()">Create</button>
                <button class="red" onclick="hideSlotForm()">Cancel</button>
            </div>

            <div id="slotContent" class="cards"></div>
        </section>

        
    </main>

    <div id="confirmBox" class="modal hidden">
        <div class="modal-card">
            <b id="confirmText">Are you sure?</b>
            <button class="green" onclick="confirmYes()">Confirm</button>
            <button class="red" onclick="closeConfirm()">Cancel</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
