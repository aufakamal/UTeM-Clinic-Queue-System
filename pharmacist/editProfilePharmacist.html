<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile Page</title>
    <link rel="stylesheet" href="../shared/profile.css">

</head>
<body>

<div class="profilePage">

    <div class="profileTitle">
        <a href="profilePharmacist.html">
            <img src="../images/backIconDark.png" class="backIcon" alt="Back">
        </a>

        <h1>EDIT PROFILE</h1>
    </div>

    <div class="profileCard">

        <div class="editHeader">
            <img src="../images/profileIconDark.png" class="editProfileImage" alt="Profile Icon">
        </div>

        <form class="editForm">

            <div class="nameRow">
                <div>
                    <label>First Name</label>
                    <input type="text" value="Natasya">
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" value="Farzana">
                </div>
            </div>

            <label>Email</label>
            <input type="email" value="syafarzana@gmail.com">

            <label>ID</label>
            <input type="text" value="PH321546">

            <label>Phone Number</label>
            <input type="text" value="0164587965">

            <label>Password</label>
            <input type="password" value="123456789">

            <a href="changePasswordPharmacist.html" class="changePasswordLink">Change password</a>

            <h3>Responsibilities</h3>
            
            <div class="responsibilityGroup">
                <label>
                    <input type="checkbox" checked>
                    Update Medication Status
                </label>
            
                <label>
                    <input type="checkbox" checked>
                    View Prescriptions
                </label>
            </div>
            
            <h3>Work Information</h3>
            
            <div class="nameRow">
                <div>
                    <label>Assigned Counter</label>
                    <select>
                        <option>Counter 1</option>
                        <option>Counter 2</option>
                    </select>
                </div>
            
                <div>
                    <label>Shift</label>
                    <select>
                        <option>Morning</option>
                        <option>Afternoon</option>
                    </select>
                </div>
            </div>

            <a href="updateProfileSuccessPharmacist.html" class="saveBtn">SAVE</a>

        </form>

    </div>

</div>
</body>
</html>
